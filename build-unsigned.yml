name: Build WDA Unsigned

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode info
        run: |
          xcodebuild -version
          sw_vers

      - name: Build WDA unsigned
        run: |
          xcodebuild clean build-for-testing \
            -project WebDriverAgent.xcodeproj \
            -derivedDataPath build \
            -scheme WebDriverAgentRunner \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ARCHS=arm64

      - name: Check output structure
        run: |
          find build/Build/Products/Debug-iphoneos -maxdepth 4 | head -40
          echo "---"
          ls -la build/Build/Products/Debug-iphoneos/WebDriverAgentRunner-Runner.app/
          echo "---"
          ls -la build/Build/Products/Debug-iphoneos/WebDriverAgentRunner-Runner.app/PlugIns/ || true

      - name: Package as unsigned ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Debug-iphoneos/WebDriverAgentRunner-Runner.app Payload/
          zip -qr WDA-unsigned.ipa Payload
          ls -la WDA-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WDA-unsigned-ipa
          path: WDA-unsigned.ipa
          retention-days: 30
